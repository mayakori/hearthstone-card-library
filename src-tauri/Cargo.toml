[package]
name = "hearthstone-card-library"
version = "0.1.0"
description = "Personal Hearthstone card library and deck workbench"
edition = "2021"

[lib]
name = "hearthstone_card_library_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "hearthstone-card-library"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
