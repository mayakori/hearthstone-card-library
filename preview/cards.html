    h1 { margin: 0 0 8px; color: #f0bd66; }
    header p { margin: 0; color: #b8a998; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; padding: 20px; }
    .card { width: 100%; padding: 0; overflow: hidden; border: 1px solid #4b3929; border-radius: 16px; background: #251c15; color: inherit; text-align: left; cursor: pointer; }
    .card:hover { border-color: #c08b4c; transform: translateY(-2px); }
    .card img { display: block; width: 100%; height: 340px; object-fit: contain; background: #0e0b09; }
    .info { padding: 16px; }
    h2 { margin: 0 0 10px; font-size: 19px; }
    .effect { min-height: 66px; margin: 0; color: #dfd2c2; line-height: 1.5; }
    .stats { margin-top: 14px; color: #c7a979; font-size: 13px; }
    dialog { width: min(1000px, calc(100% - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid #654a32; border-radius: 18px; background: #1d1611; color: #f5eadc; }
    dialog::backdrop { background: rgba(0, 0, 0, .78); }
    .close { position: sticky; top: 12px; z-index: 2; float: right; margin: 12px; width: 38px; height: 38px; border: 1px solid #6a513d; border-radius: 50%; background: #2c2119; color: white; cursor: pointer; }
    .detail { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 24px; padding: 26px; }
    .detail > img { width: 100%; max-height: 520px; object-fit: contain; }
    .detail h2 { color: #f0bd66; font-size: 28px; }
    .detail-text { color: #eadfce; line-height: 1.6; }
    dl { display: grid; grid-template-columns: minmax(150px, 210px) 1fr; gap: 7px 12px; }
    dt { color: #ad9984; }
    dd { margin: 0; }
    blockquote { margin: 18px 0; padding: 13px 15px; border-left: 3px solid #a97a43; background: #261c15; color: #cbbb9f; }
    .related-section { padding: 0 26px 30px; }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .related { padding: 10px; border: 1px solid #483628; border-radius: 12px; background: #241a14; }
    .related img { width: 100%; height: 200px; object-fit: contain; }
    .related strong { display: block; margin: 7px 0; color: #efc77e; }
    .related p { margin: 0; color: #cfc0af; font-size: 13px; line-height: 1.45; }
    .none { color: #9e8e7d; }
    @media (max-width: 720px) { .detail { grid-template-columns: 1fr; } }
  </style>

    }

    document.querySelector("#summary").textContent =
      "카드를 클릭하면 상세 정보와 관련 카드를 볼 수 있습니다 · " + data.cards.length + "장";

    function addField(list, label, content) {
      const term = document.createElement("dt");
      const description = document.createElement("dd");
      term.textContent = label;
      description.textContent = value(content);
      list.append(term, description);
    }

    function openDetail(card) {
      const detailImage = document.querySelector("#detail-image");
      detailImage.src = card.image;
      detailImage.alt = card.name;
      document.querySelector("#detail-name").textContent = card.name;
      document.querySelector("#detail-text").textContent = card.text;

      const fields = document.querySelector("#detail-fields");
      fields.replaceChildren();
      for (const [label, content] of [
        ["종류", card.type], ["하수인 종류", card.minionType],
        ["주문 속성", card.spellSchool], ["등급", card.rarity],
        ["세트", card.set], ["직업", card.cardClass],
        ["제작 비용", dustText(card, "craft")],
        ["마력 추출 시 획득하는 가루", dustText(card, "disenchant")],
        ["아티스트", card.artistName],
        ["수집 여부", card.collectible === false ? "수집 불가" : "수집 가능"],
        ["카드 ID", card.id], ["마나", card.manaCost],
        ["공격력", card.attack], ["생명력", card.health]
      ]) {
        if (content !== "") addField(fields, label, content);
      }

      document.querySelector("#detail-flavor").textContent =
        card.flavorText || "플레이버 텍스트 없음";

      const root = document.querySelector("#related-cards");
      root.replaceChildren();
      const related = card.childIds.map((id) => relatedById.get(id)).filter(Boolean);
      if (!related.length) {
        const empty = document.createElement("p");
        empty.className = "none";
        empty.textContent = "관련 카드가 없습니다.";
        root.append(empty);
      } else {
        for (const child of related) {
          const item = document.createElement("article");
          item.className = "related";
          const image = document.createElement("img");
          const name = document.createElement("strong");
          const text = document.createElement("p");
          image.src = child.image;
          image.alt = child.name;
          name.textContent = child.name;
          text.textContent = child.text;
          item.append(image, name, text);
          root.append(item);
        }
      }
      dialog.showModal();
    }

    for (const card of data.cards) {
      const article = document.createElement("button");
      const image = document.createElement("img");
      const info = document.createElement("div");
      const name = document.createElement("h2");
      const effect = document.createElement("p");
      const stats = document.createElement("div");
      article.type = "button";
      article.className = "card";
      image.src = card.image;
      image.alt = card.name;
      info.className = "info";
      effect.className = "effect";
      stats.className = "stats";
      name.textContent = card.name;
      effect.textContent = card.text;
      stats.textContent = "마나 " + value(card.manaCost) +
        " · 공격 " + value(card.attack) + " · 생명력 " + value(card.health);
      info.append(name, effect, stats);
      article.append(image, info);
      article.addEventListener("click", () => openDetail(card));
      grid.append(article);
    }

    document.querySelector(".close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
